<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Durak</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a2e;
        color: #e9e9e9;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      .game-board {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        box-sizing: border-box;
      }
      .top-area {
        display: flex;
        justify-content: space-around;
        align-items: flex-start;
      }
      .center-area {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      .bottom-area {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .table-area {
        background: rgba(15, 52, 96, 0.5);
        padding: 40px;
        border-radius: 50%;
        min-height: 350px;
        min-width: 600px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        align-items: center;
        border: 2px dashed rgba(233, 69, 96, 0.3);
        position: relative;
      }
      .card {
        width: 70px;
        height: 105px;
        background: white;
        color: black;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.2rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        position: relative;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        user-select: none;
        flex-shrink: 0;
      }
      .card:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        z-index: 10;
      }
      .card.hearts, .card.diamonds { color: #e94560; }
      .card.spades, .card.clubs { color: #1a1a2e; }
      
      .card-back {
        background: #0f3460;
        background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,.05) 5px, rgba(255,255,255,.05) 10px);
        border: 2px solid #e94560;
      }

      .deck-area {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .deck-stack {
        position: relative;
        width: 70px;
        height: 105px;
      }
      .deck-card {
        position: absolute;
        left: 0;
        top: 0;
      }
      .trump-card {
        transform: rotate(90deg) !important;
        left: 40px !important;
        transition: none !important;
        z-index: -1;
      }

      .discard-area {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      @keyframes deal {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .card-dealt {
        animation: deal 0.3s ease-out;
      }

      @keyframes throw-from-bottom {
        from { transform: translateY(200px) rotate(20deg); opacity: 0; }
        to { transform: translateY(0) rotate(0deg); opacity: 1; }
      }
      .throw-bottom {
        animation: throw-from-bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes throw-from-top {
        from { transform: translateY(-200px) rotate(-20deg); opacity: 0; }
        to { transform: translateY(0) rotate(0deg); opacity: 1; }
      }
      .throw-top {
        animation: throw-from-top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .discard-stack {
        position: relative;
        width: 70px;
        height: 105px;
      }

      .player-box {
        background: #0f3460;
        padding: 15px;
        border-radius: 12px;
        border: 2px solid transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 120px;
        transition: all 0.3s;
      }
      .player-box.active {
        border-color: #e94560;
        box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        background: #16213e;
      }
      .player-box.defender {
        border-color: #f7d794;
      }
      .mini-hand {
        display: flex;
        margin-top: 10px;
        height: 30px;
      }
      .mini-card {
        width: 15px;
        height: 25px;
        background: #e94560;
        border: 1px solid white;
        border-radius: 2px;
        margin-left: -10px;
        box-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      }
      .mini-card:first-child { margin-left: 0; }

      .human-area {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      .human-hand {
        display: flex;
        gap: 10px;
        flex-wrap: nowrap;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        max-width: 90vw;
        overflow-x: auto;
      }
      .btn-primary {
          background: #e94560;
          color: white;
          border: none;
          padding: 15px 30px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: bold;
          font-size: 1.1rem;
          transition: transform 0.2s;
      }
      .btn-primary:hover { transform: scale(1.05); }
      .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
      
      .log-container {
        position: fixed;
        bottom: 20px;
        left: 20px;
        width: 280px;
        height: 180px;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.75rem;
        color: #0f0;
        opacity: 0.4;
        transition: opacity 0.3s;
        z-index: 100;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(0, 255, 0, 0.1);
      }
      .log-container:hover { opacity: 1; }
      
      .log-list {
        flex-grow: 1;
        overflow-y: auto;
        padding: 10px;
        scrollbar-width: thin;
        scrollbar-color: #0f0 transparent;
      }
      .copy-btn {
        background: #0f3460;
        color: #0f0;
        border: 1px solid #0f0;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 0.6rem;
        cursor: pointer;
        align-self: flex-end;
        margin: 5px 5px 0 0;
        transition: all 0.2s;
      }
      .copy-btn:hover {
        background: #0f0;
        color: #000;
      }

      .bout-pair {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 125px;
        width: 80px;
      }
      .defender-card {
        position: absolute;
        top: 20px;
        left: 10px;
        z-index: 1;
      }

      .overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.9);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .overlay h2 { font-size: 3rem; color: #e94560; margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <div id="game-over-overlay" class="overlay">
        <h2 id="winner-text">GAME OVER</h2>
        <button id="btn-restart-overlay" class="btn-primary">PLAY AGAIN</button>
    </div>

    <div class="game-board">
        <div class="top-area" id="bot-players">
            <!-- Bot players rendered here -->
        </div>

        <div class="center-area">
            <div class="deck-area">
                <div class="deck-stack" id="deck-stack">
                    <!-- Deck cards rendered here -->
                </div>
                <div style="margin-top: 50px; font-weight: bold; color: #888; text-align: center;">DECK: <span id="deck-count">0</span></div>
            </div>

            <div class="table-area" id="bout-area">
                <!-- Active cards rendered here -->
            </div>

            <div class="discard-area">
                <div class="discard-stack" id="discard-stack">
                    <!-- Discarded cards rendered here -->
                </div>
                <div style="margin-top: 10px; font-weight: bold; color: #888; text-align: center;">BEATEN: <span id="discard-count">0</span></div>
            </div>
        </div>

        <div class="bottom-area">
            <div class="human-area">
                <div id="human-controls" style="display: none; gap: 10px;">
                    <button id="btn-pass" class="btn-primary" style="background: #e94560;">PASS / END TURN</button>
                    <button id="btn-take" class="btn-primary" style="background: #f7d794; color: #1a1a2e;">TAKE CARDS</button>
                </div>
                <div class="human-hand" id="human-hand">
                    <!-- Human cards rendered here -->
                </div>
                <h3 id="human-name" style="margin: 5px 0 0 0;">You</h3>
            </div>
        </div>

        <div class="log-container">
            <button id="btn-copy-log" class="copy-btn">COPY LOG</button>
            <div id="game-log" class="log-list">
                <div>Game log started...</div>
            </div>
        </div>

        <button id="btn-restart-main" style="position: fixed; top: 10px; right: 10px; background: transparent; border: 1px solid #e94560; color: #e94560; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; z-index: 10;">RESTART</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
